version = 1

[setups.typescript]
description = "TypeScript/JavaScript Oxlint rules; installs the plugin and verifies its dedicated lint command."

[setups.typescript.package_json.devDependencies]
"oxlint" = "1.90.0"
"@oxlint/plugins" = "1.90.0"
"oxc-parser" = "0.159.0"

[setups.typescript.package_json.scripts]
"lint:anti-slop" = "node tools/oxlint/anti-slop/check-suppressions.mjs && oxlint --config oxlint.anti-slop.config.ts ."

[setups.typescript.activation.scripts]
lint = ["lint:anti-slop"]

[setups.typescript.activation]
verify = [["node-package-manager", "run", "lint:anti-slop"]]

[setups.typescript.files]
".mise/tasks/lint/typescript.toml" = "integrations/mise-tasks/typescript/lint.toml"
"oxlint.anti-slop.config.ts" = "integrations/oxlint.config.ts"
"tools/oxlint/anti-slop" = "src"
"tools/oxlint/anti-slop/LICENSE" = "LICENSE"

# Select this instead of typescript for projects directly using Effect.
# Its single lint pass combines the shared generic rules, custom Effect
# architecture checks, and official type-aware Effect diagnostics.
[setups.effect]
description = "Effect-aware TypeScript lint; generic anti-slop, custom Effect rules, and official @effect/tsgo diagnostics in one pass."

[setups.effect.recommendation]
dependencies = ["effect", "typescript"]
note = "Effect + TypeScript"

[setups.effect.package_json.devDependencies]
"@effect/tsgo" = "0.67.4"
"typescript" = "7.0.2"
"oxlint" = "1.90.0"
"@oxlint/plugins" = "1.90.0"
"oxlint-tsgolint" = "7.0.2005"
"oxc-parser" = "0.159.0"

[setups.effect.package_json.scripts]
"lint:anti-slop" = "node tools/oxlint/anti-slop/check-suppressions.mjs && effect-tsgo oxlint --config oxlint.anti-slop.effect.config.ts ."

[setups.effect.activation.scripts]
lint = ["lint:anti-slop"]

[setups.effect.activation]
verify = [["node-package-manager", "run", "lint:anti-slop"]]

[setups.effect.files]
".mise/tasks/lint/effect.toml" = "integrations/mise-tasks/effect/lint.toml"
"oxlint.anti-slop.config.ts" = "integrations/oxlint.config.ts"
"oxlint.anti-slop.effect.config.ts" = "integrations/effect/oxlint.config.ts"
"tools/oxlint/anti-slop" = "src"
"tools/oxlint/anti-slop/LICENSE" = "LICENSE"

[setups.shadcn]
description = "Full enhanced shadcn lint; activates all rules exported by the packaged plugin."

[setups.shadcn.package_json.scripts]
"lint:shadcn" = "oxlint --config oxlint.shadcn.config.mjs ."

[setups.shadcn.activation.scripts]
lint = ["lint:shadcn"]

[setups.shadcn.activation]
verify = [["node-package-manager", "run", "lint:shadcn"]]

[setups.shadcn.package_json.devDependencies]
"oxlint" = "1.90.0"
"@shadcn/lint" = "file:tools/oxlint/shadcn-lint"

[setups.shadcn.files]
".mise/tasks/lint/shadcn.toml" = "integrations/mise-tasks/shadcn/lint.toml"
"oxlint.shadcn.config.mjs" = "languages/shadcn/oxlint.config.mjs"
"tools/oxlint/shadcn-lint" = "integrations/shadcn-lint/package"

[setups.stylex]
description = "StyleX lint; installs official and design-system rules with the published default token paths."

[setups.stylex.package_json.scripts]
"lint:stylex" = "oxlint --config oxlint.stylex.config.ts ."

[setups.stylex.activation.scripts]
lint = ["lint:stylex"]

[setups.stylex.activation]
verify = [["node-package-manager", "run", "lint:stylex"]]

[setups.stylex.package_json.devDependencies]
"oxlint" = "1.90.0"
"@stylexjs/eslint-plugin" = "0.19.1"
"eslint-plugin-stylex-design-system" = "file:tools/eslint/stylex-design-system"

[setups.stylex.files]
".mise/tasks/lint/stylex.toml" = "integrations/mise-tasks/stylex/lint.toml"
"oxlint.stylex.config.ts" = "languages/stylex/oxlint.config.example.ts"
"tools/eslint/stylex-design-system" = "integrations/stylex-design-system/package"

[setups.css]
description = "Complete CSS lint suite; installs the authoritative Stylelint configuration and every anti-slop CSS rule."

[setups.css.package_json.devDependencies]
"stylelint" = "17.16.0"
"stylelint-config-standard" = "40.0.0"

[setups.css.package_json.scripts]
"lint:css-anti-slop" = "stylelint --config stylelint.anti-slop.config.mjs \"**/*.css\" --allow-empty-input"

[setups.css.activation.scripts]
lint = ["lint:css-anti-slop"]

[setups.css.activation]
verify = [["node-package-manager", "run", "lint:css-anti-slop"]]

[setups.css.files]
".mise/tasks/lint/css.toml" = "integrations/mise-tasks/css/lint.toml"
"stylelint.anti-slop.config.mjs" = "languages/css/stylelint.config.mjs"
"tools/stylelint/anti-slop-css" = "skills/install-anti-slop-css/assets/anti-slop-css"

[setups.css-tailwind]
description = "Strict Tailwind v4 CSS lint; enforces globals.css/tokens.css ownership and checks all authored CSS."

[setups.css-tailwind.package_json.scripts]
"lint:css-tailwind" = "stylelint --config stylelint.anti-slop-tailwind.config.mjs \"**/*.css\" --allow-empty-input"

[setups.css-tailwind.activation.scripts]
lint = ["lint:css-tailwind"]

[setups.css-tailwind.activation]
verify = [["node-package-manager", "run", "lint:css-tailwind"]]

[setups.css-tailwind.package_json.devDependencies]
"stylelint" = "17.16.0"
"stylelint-config-standard" = "40.0.0"

[setups.css-tailwind.files]
".mise/tasks/lint/css-tailwind.toml" = "integrations/mise-tasks/css-tailwind/lint.toml"
"stylelint.anti-slop-tailwind.config.mjs" = "languages/css/stylelint.config.mjs"
"tools/stylelint/anti-slop-css" = "skills/install-anti-slop-css/assets/anti-slop-css"

[setups.python]
description = "Python anti-slop Pylint checks; runs through a pinned uvx environment."

[setups.python.activation]
verify = [["bash", "tools/pylint/lint.sh", "."]]

[setups.python.files]
".mise/tasks/lint/python.toml" = "integrations/mise-tasks/python/lint.toml"
"tools/pylint/lint.sh" = "languages/python/lint.sh"
"tools/pylint/anti_slop.py" = "languages/python/anti_slop.py"

[setups.rust]
description = "Clippy and rustc anti-slop profiles; runs with the denied lints sourced from the installed profile."

[setups.rust.activation]
verify = [["bash", "tools/anti-slop/rust/lint.sh"]]

[setups.rust.files]
".mise/tasks/lint/rust.toml" = "integrations/mise-tasks/rust/lint.toml"
"tools/anti-slop/rust/lint.sh" = "languages/rust/lint.sh"
"tools/anti-slop/rust/anti-slop-clippy.toml" = "languages/rust/anti-slop-clippy.toml"
"tools/anti-slop/rust/anti-slop-rust.toml" = "languages/rust/anti-slop-rust.toml"

[setups.go]
description = "Go analysis multichecker; compiles the included module and checks target project packages."

[setups.go.activation]
verify = [["bash", "tools/anti-slop/lint.sh", "./..."]]

[setups.go.files]
".mise/tasks/lint/go.toml" = "integrations/mise-tasks/go/lint.toml"
"tools/anti-slop" = "languages/go"

[setups.codehygiene]
description = "Optional advisory structural review; installs the pinned uvx launcher and verifies it is callable."

[setups.codehygiene.activation]
verify = [["bash", "tools/anti-slop/codehygiene/run.sh", "--help"]]

[setups.codehygiene.files]
".mise/tasks/review/codehygiene.toml" = "integrations/mise-tasks/review/codehygiene.toml"
"tools/anti-slop/codehygiene/run.sh" = "integrations/codehygiene/run.sh"
"tools/anti-slop/codehygiene/README.md" = "integrations/codehygiene/README.md"

[setups.landmines]
description = "Optional Landmines Oxlint checks; installs the upstream plugin and runs its recommended eight rules."

[setups.landmines.package_json.scripts]
"lint:landmines" = "oxlint --config oxlint.landmines.config.json ."

[setups.landmines.activation.scripts]
lint = ["lint:landmines"]

[setups.landmines.activation]
verify = [["node-package-manager", "run", "lint:landmines"]]

[setups.landmines.package_json.devDependencies]
"oxlint" = "1.90.0"
"@interfere/landmines" = "0.1.0"

[setups.landmines.files]
".mise/tasks/lint/landmines.toml" = "integrations/mise-tasks/landmines/lint.toml"
"oxlint.landmines.config.json" = "integrations/landmines/oxlint.config.json"
"tools/oxlint/landmines-recommended.json" = "integrations/landmines/recommended.json"
