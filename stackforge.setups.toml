version = 1

[setups.typescript]
description = "STAGED, NOT ACTIVE: install matching oxlint/@oxlint/plugins, merge copied rules into .oxlintrc.json or configure --config oxlint.config.ts, then run lint:anti-slop. See README.md#activate-stackforge-setups."

[setups.typescript.package_json.scripts]
"lint:anti-slop" = "oxlint ."

[setups.typescript.files]
"oxlint.config.ts" = "integrations/oxlint.config.ts"
"tools/oxlint/anti-slop" = "src"
"tools/oxlint/anti-slop/LICENSE" = "LICENSE"

[setups.shadcn]
description = "STAGED, NOT ACTIVE: register @shadcn/lint in the project's Oxlint or ESLint config, enable reviewed shadcn rules, and run the UI linter. See languages/shadcn/README.md."

[setups.shadcn.package_json.devDependencies]
"@shadcn/lint" = "file:tools/oxlint/shadcn-lint"

[setups.shadcn.files]
"tools/oxlint/shadcn-lint" = "integrations/shadcn-lint/package"

[setups.stylex]
description = "STAGED, NOT ACTIVE: merge languages/stylex/oxlint.config.example.ts with the active lint config, set real token/component paths, and run Oxlint. See languages/stylex/README.md."

[setups.stylex.package_json.devDependencies]
"@stylexjs/eslint-plugin" = "0.19.1"
"eslint-plugin-stylex-design-system" = "file:tools/eslint/stylex-design-system"

[setups.stylex.files]
"tools/eslint/stylex-design-system" = "integrations/stylex-design-system/package"

[setups.css]
description = "STAGED, NOT ACTIVE: install Stylelint and stylelint-config-standard, merge languages/css/stylelint.config.mjs with project-specific paths, then run Stylelint. See languages/css/README.md."

[setups.css.files]
"tools/stylelint/anti-slop-css" = "skills/install-anti-slop-css/assets/anti-slop-css"

[setups.css-tailwind]
description = "STAGED, NOT ACTIVE: strict Tailwind v4 CSS ownership; only src/styles/globals.css and src/styles/tokens.css, no CSS Modules. Wire Stylelint into the owning project lint/CI commands after migration."

[setups.css-tailwind.package_json.devDependencies]
"stylelint" = "17.16.0"
"stylelint-config-standard" = "40.0.0"

[setups.css-tailwind.files]
"stylelint.config.mjs" = "languages/css/stylelint.config.mjs"
"tools/stylelint/anti-slop-css" = "skills/install-anti-slop-css/assets/anti-slop-css"

[setups.python]
description = "STAGED, NOT ACTIVE: install Pylint, load tools.pylint.anti_slop and lint project-owned Python files. See languages/python/README.md."

[setups.python.files]
"tools/pylint/anti_slop.py" = "languages/python/anti_slop.py"

[setups.rust]
description = "STAGED, NOT ACTIVE: merge the copied profiles into Cargo.toml [lints.clippy] and [lints.rust] (or workspace equivalents), then run cargo clippy. See languages/rust/README.md."

[setups.rust.files]
"tools/anti-slop/rust/anti-slop-clippy.toml" = "languages/rust/anti-slop-clippy.toml"
"tools/anti-slop/rust/anti-slop-rust.toml" = "languages/rust/anti-slop-rust.toml"

[setups.go]
description = "STAGED, NOT ACTIVE: build the included tools/anti-slop Go module (go.mod already exists), then run the multichecker on project packages. See languages/go/README.md."

[setups.go.files]
"tools/anti-slop" = "languages/go"

[setups.codehygiene]
description = "STAGED, NOT ACTIVE: use uvx to review individual changed files with the pinned CodeHygiene CLI; add --check only after choosing a blocking policy. See integrations/codehygiene/README.md."

[setups.codehygiene.files]
"tools/anti-slop/codehygiene/run.sh" = "integrations/codehygiene/run.sh"
"tools/anti-slop/codehygiene/README.md" = "integrations/codehygiene/README.md"

[setups.landmines]
description = "STAGED, NOT ACTIVE: extend the active Oxlint config with tools/oxlint/landmines-recommended.json, review rule overlaps, then run Oxlint. See integrations/landmines/README.md."

[setups.landmines.package_json.devDependencies]
"@interfere/landmines" = "0.1.0"

[setups.landmines.files]
"tools/oxlint/landmines-recommended.json" = "integrations/landmines/recommended.json"
