version = 1

[setups.typescript]
description = "Install the anti-slop Oxlint plugin for TypeScript and JavaScript projects."

[setups.typescript.package_json.devDependencies]
oxlint = "1.87.0"
"@oxlint/plugins" = "1.87.0"

[setups.typescript.package_json.scripts]
"lint:anti-slop" = "oxlint ."

[setups.typescript.files]
"oxlint.config.ts" = "integrations/oxlint.config.ts"
"tools/oxlint/anti-slop" = "src"
"tools/oxlint/anti-slop/LICENSE" = "LICENSE"

[setups.shadcn]
description = "Stage complete enhanced @shadcn/lint (six upstream and thirteen Good CSS rules); configure only reviewed rules."

[setups.shadcn.package_json.devDependencies]
"@shadcn/lint" = "file:tools/oxlint/shadcn-lint"

[setups.shadcn.files]
"tools/oxlint/shadcn-lint" = "integrations/shadcn-lint/package"

[setups.stylex]
description = "Stage StyleX ESLint token rules; preserve existing lint configuration and styling systems."

[setups.stylex.package_json.devDependencies]
"@stylexjs/eslint-plugin" = "0.19.1"

[setups.stylex.files]
"tools/eslint/anti-slop-stylex" = "skills/install-anti-slop-stylex/assets/anti-slop-stylex"

[setups.css]
description = "Stage the anti-slop Stylelint plugin while preserving existing CSS tooling."

[setups.css.files]
"tools/stylelint/anti-slop-css" = "skills/install-anti-slop-css/assets/anti-slop-css"

[setups.python]
description = "Stage the Python anti-slop Pylint checker and preserve existing Python tooling."

[setups.python.files]
"tools/pylint/anti_slop.py" = "languages/python/anti_slop.py"

[setups.rust]
description = "Stage Rust anti-slop Clippy and rustc policies for Cargo lint integration."

[setups.rust.files]
"tools/anti-slop/rust/anti-slop-clippy.toml" = "languages/rust/anti-slop-clippy.toml"
"tools/anti-slop/rust/anti-slop-rust.toml" = "languages/rust/anti-slop-rust.toml"

[setups.go]
description = "Stage the Go anti-slop analyzer source for repository-local integration."

[setups.go.files]
"tools/anti-slop" = "languages/go"
